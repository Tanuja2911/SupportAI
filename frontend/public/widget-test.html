<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SupportAI Widget Test</title>
    <style>
      body { margin: 0; padding: 48px 24px; background: #f8fafc; color: #1e293b; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 680px; margin: 0 auto; padding: 32px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; }
      h1 { margin-top: 0; }
      label { display: block; margin: 24px 0 8px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 8px; background: #4f46e5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      #status { min-height: 24px; margin-top: 16px; color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <h1>Test your SupportAI chat widget</h1>
      <p>Paste your business API key from the SupportAI Dashboard, select Start test, then use the chat button at the bottom of the page.</p>
      <label for="api-key">Business API key</label>
      <input id="api-key" type="password" autocomplete="off" placeholder="Paste your API key">
      <button id="start-test" type="button">Start test</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      const startButton = document.getElementById('start-test');
      const keyInput = document.getElementById('api-key');
      const status = document.getElementById('status');

      startButton.addEventListener('click', () => {
        const apiKey = keyInput.value.trim();
        if (!apiKey) {
          status.textContent = 'Paste your business API key first.';
          return;
        }

        startButton.disabled = true;
        status.textContent = 'Loading the chat widget…';
        const script = document.createElement('script');
        script.src = `${window.location.origin}/widget/widget.js`;
        script.onload = () => {
          window.SupportAI.init({ apiKey, serverUrl: window.location.origin });
          keyInput.value = '';
          status.textContent = 'Widget loaded. Use the chat button in the bottom corner.';
        };
        script.onerror = () => {
          status.textContent = 'Could not load the widget. Please try again.';
          startButton.disabled = false;
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
