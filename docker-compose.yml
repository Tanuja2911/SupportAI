version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supportiq
      POSTGRES_PASSWORD: supportiq
      POSTGRES_DB: supportiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://supportiq:supportiq@db:5432/supportiq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-prod
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./widget:/app/widget:ro
      - upload_data:/app/uploads
      - index_data:/app/vector_indices
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://supportiq:supportiq@db:5432/supportiq
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./widget:/app/widget:ro
      - upload_data:/app/uploads
      - index_data:/app/vector_indices
    command: celery -A app.services.document_processor.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
  index_data:
